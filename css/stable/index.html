<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation CSSFontFace Host</title>
  <link rel="icon" type="image/png" href="/pstation.png">
  <style>
    :root {
      --bg: #050706;
      --panel: #080c0a;
      --raised: #0d1510;
      --line: #34443a;
      --line-bright: #607b68;
      --text: #f1f6f2;
      --muted: #b4c1b8;
      --dim: #86958b;
      --green: #73f5a6;
      --red: #ff9b9b;
      --yellow: #e4d27b;

    }

    #cache {
      color: var(--dim);
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      min-height: 24px;
      overflow-wrap: anywhere;
    }

    #cache.cacheok {
      color: var(--green);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(rgba(115, 245, 166, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(115, 245, 166, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      font: 16px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex: 1 0 auto;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: 24px 0 20px;
      width: min(100% - 64px, 1120px);
    }

    .header-section,
    .status-container,
    .controls-section {
      background: rgba(8, 12, 10, 0.92);
      border: 1px solid var(--line);
    }

    .header-section {
      margin-bottom: 12px;
      padding: 20px 28px 22px;
      position: relative;
    }

    .header-section::before {
      color: var(--green);
      content: "●  PS4 / CSSFONTFACE HOST";
      display: block;
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .header-section::after {
      color: var(--dim);
      content: "SYS / READY   //   AUTO JAILBREAK";
      font-size: 12px;
      letter-spacing: 0.08em;
      position: absolute;
      right: 28px;
      top: 21px;
    }

    .main-title {
      color: var(--text);
      font-size: clamp(30px, 5vw, 50px);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 1.05;
    }

    .main-title::before { color: var(--green); content: "> "; }
    .subtitle { color: var(--green); font-size: 16px; margin-top: 12px; }
    .version-info { color: var(--muted); font-size: 14px; margin-top: 7px; }
    #UA { color: var(--dim); display: block; font-size: 12px; margin-top: 7px; overflow-wrap: anywhere; }

    .status-container {
      color: var(--muted);
      padding: 14px 18px;
    }

    .status-label,
    .section-title {
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      padding-bottom: 9px;
      text-transform: uppercase;
    }

    #console {
      background: var(--panel);
      border: 1px solid var(--line-bright);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      max-height: 132px;
      min-height: 42px;
      overflow: auto;
      padding: 10px 14px;
      white-space: pre-wrap;
    }

    .controls-section { margin-top: 12px; padding: 16px 18px; }

    #kernel-options {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    .chain-label,
    .auto-jb-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chain-options { display: flex; gap: 8px; }
    #kernel-options input[type="radio"] { height: 1px; opacity: 0; position: absolute; width: 1px; }

    .chain-option,
    #jeilbrek,
    .auto-jb-label {
      background: var(--panel);
      border: 1px solid var(--line-bright);
      border-radius: 0;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      min-height: 42px;
      padding: 8px 12px;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    #kernel-options input[type="radio"]:focus + .chain-option,
    #kernel-options input[type="radio"]:checked + .chain-option,
    .chain-option:hover,
    #jeilbrek:hover,
    #jeilbrek:focus,
    .auto-jb-label:hover {
      background: var(--raised);
      border-color: var(--green);
      color: var(--green);
      outline: none;
    }

    #jeilbrek:disabled { cursor: wait; opacity: 0.55; }

    .auto-jb {
      align-items: center;
      display: flex;
      gap: 8px;
    }

    .auto-jb-label {
      align-items: center;
      display: flex;
      font-size: 14px;
      text-transform: none;
    }

    #autoJbInput {
      accent-color: var(--green);
      height: 18px;
      width: 18px;
    }

    .credits {
      border-top: 1px solid var(--line);
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 13px;
      margin: 0 auto;
      padding: 8px 20px 10px;
      text-align: center;
      width: min(100% - 64px, 1120px);
    }

    .credits a { color: var(--text); }
    .credits a:hover, .credits a:focus { color: var(--green); }
    .credits-line { display: inline; }
    .credits-line + .credits-line::before { color: var(--line-bright); content: "  //  "; }
    .credit-label { color: var(--muted); }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .container { justify-content: flex-start; padding: 24px 0 20px; width: min(100% - 32px, 560px); }
      .header-section { padding: 20px 18px 22px; }
      .header-section::after { display: none; }
      .main-title { font-size: clamp(30px, 9vw, 44px); }
      #kernel-options { align-items: flex-start; flex-direction: column; }
      .chain-options { width: 100%; }
      .chain-option { flex: 1; }
      .credits-line { display: block; margin: 4px 0; }
      .credits-line + .credits-line::before { content: ""; }
    }

    #kernel-options input[type="radio"]:disabled + .chain-option,
    #kernel-options input[type="radio"]:disabled + .chain-option:hover {
    background: var(--panel);
    border-color: var(--line);
    color: var(--dim);
    cursor: not-allowed;
    opacity: 0.45;
  }

    @media (max-width: 430px) {
      .chain-options { width: 100%; }
      .chain-option { flex: 1; }
      #jeilbrek, .auto-jb { width: 100%; }
      .auto-jb { justify-content: space-between; }
      .main-title { font-size: 30px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="header-section">
      <h1 class="main-title">Play Station 4 CSSFontFace</h1>
      <p class="subtitle">Offline CSSFontFace Auto GoldHEN</p>
      <p class="version-info">CSSFontFace PS4 FW 6.00–11.02 GoldHEN v2.4b18.5</p>
      <p id="UA">Running on:</p>
      <p id="cache">Checking offline cache...</p>
    </section>

    <section class="status-container">
      <div class="status-label">Exploit output</div>
      <pre id="console">Ready. Awaiting execution...</pre>
    </section>

    <section class="controls-section">
      <div class="section-title">Exploit control</div>
      <form id="kernel-options">
        <span class="chain-label">Kernel chain</span>
        <div class="chain-options">
          <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl" disabled>
          <label class="chain-option" for="netctrl-exploit">Poops</label>
          <input type="radio" name="kernel" id="lapse-exploit" value="lapse" checked>
          <label class="chain-option" for="lapse-exploit">Lapse</label>
        </div>
        <button id="jeilbrek" type="button">Jailbreak</button>
        <div class="auto-jb">
          <label class="auto-jb-label" for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
          <input id="autoJbInput" type="checkbox">
        </div>
      </form>
    </section>
  </main>

      <div class="credits">
        <div class="credits-line">
            <span class="credit-label">Github Repository -</span>
            <a href="https://github.com/itskenethb?tab=repositories" class="nodeplay-link">itskenethb</a>
        </div>
    </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <script>
    (function () {var cacheEl = document.getElementById("cache");
        function setCache(text, ok) {
            if (!cacheEl) return;
            cacheEl.textContent = text;
            cacheEl.className = ok ? "cacheok" : "";
        }

        var ac = window.applicationCache;

        if (!ac || !document.documentElement.hasAttribute("manifest")) {
            setCache("application cache unavailable");
        } else if (!navigator.onLine) {
            setCache("offline -- using cached resources", true);
        } else if (ac.status === ac.IDLE) {
            setCache("cached -- offline ready", true);
        } else if (ac.status === ac.UPDATEREADY) {
            try {
                ac.swapCache();
            } catch (e) {}
            setCache("update downloaded -- offline ready", true);
        } else {
            setCache("checking cache...");

            ac.addEventListener("downloading", function () {
                setCache("caching for offline (first run)...");
            }, false);

            ac.addEventListener("progress", function (e) {
                if (e && e.total) {
                    setCache(
                        "caching " +
                        Math.round((e.loaded / e.total) * 100) +
                        "%"
                    );
                }
            }, false);

            ac.addEventListener("cached", function () {
                setCache("cached for offline use disconnect to the internet first and rerun this page", true);
            }, false);

            ac.addEventListener("updateready", function () {
                try {
                    ac.swapCache();
                } catch (e) {}
                setCache("update downloaded -- offline ready", true);
            }, false);

            ac.addEventListener("noupdate", function () {
                setCache("cached -- offline ready", true);
            }, false);

            ac.addEventListener("error", function () {
                setCache("cache unavailable");
            }, false);

            ac.addEventListener("obsolete", function () {
                setCache("cache obsolete");
            }, false);
        }
    })();
    </script>
        <script>
(function () {
    
    var FIRMWARE_MODE = 'range';
    var MIN_FIRMWARE = 6.00;
    var MAX_FIRMWARE = 11.02;
    
    // var FIRMWARE_MODE = 'exact';
    // var REQUIRED_FIRMWARE = 6.72;

    // var FIRMWARE_MODE = 'list';
    // var ALLOWED_FIRMWARES = [9.00,9.03,9.04,9.50];

    function getRootSelector() {
      return '/webkit/';
    }

    function getPS4Firmware() {
        var ua = navigator.userAgent;
        if (/PlayStation 5/i.test(ua)) {
            return null;
        }
        if (!/PlayStation 4/i.test(ua)) {
            return null;
        }
        var match = ua.match(
          /PlayStation\s+4[\/ ](\d+)\.(\d+)/i
        );
        if (!match) {
            return null;
        }
        return parseFloat(match[1] + "." + match[2]);
    }

    function isPS4() {
        var ua = navigator.userAgent;
        if (/PlayStation 5/i.test(ua)) {
            return false;
        }
        return /PlayStation 4/i.test(ua);
    }

    function isFirmwareSupported(firmware) {
        if (firmware === null) {
            return false;
        }

        if (FIRMWARE_MODE === 'exact') {
            return firmware === REQUIRED_FIRMWARE;
        }

        if (FIRMWARE_MODE === 'range') {
            return (
                firmware >= MIN_FIRMWARE &&
                firmware <= MAX_FIRMWARE
            );
        }

        if (FIRMWARE_MODE === 'list') {
            return ALLOWED_FIRMWARES.indexOf(firmware) !== -1;
        }
        return false;
    }

    function getSupportedFirmwareText() {
        if (FIRMWARE_MODE === 'exact') {
            return REQUIRED_FIRMWARE.toFixed(2);
        }

        if (FIRMWARE_MODE === 'range') {
            return (
                MIN_FIRMWARE.toFixed(2) +
                ' - ' +
                MAX_FIRMWARE.toFixed(2)
            );
        }

        if (FIRMWARE_MODE === 'list') {
            return ALLOWED_FIRMWARES
                .map(function (fw) {
                    return fw.toFixed(2);
                })
                .join(', ');
        }
        return 'UNKNOWN';
    }

    function showUnsupportedDevice() {
        document.documentElement.classList.add(
            'security-error'
        );
        var screen = document.createElement('div');
        screen.id = 'securityScreen';
        screen.innerHTML =
            '<div class="security-message">' +
                '<div class="security-title">' +
                    'UNSUPPORTED DEVICE' +
                '</div>' +
                '<div class="security-info">' +
                    'This page is only supported on PlayStation 4.' +
                '</div>' +
                '<div class="security-countdown">' +
                    'Redirecting to firmware selection in ' +
                    '<span id="securityCountdown">3</span>...' +
                '</div>' +
            '</div>';
        document.body.appendChild(screen);
        startCountdown();
    }

    function showUnsupportedFirmware(firmware) {
        document.documentElement.classList.add(
            'security-error'
        );
        var screen = document.createElement('div');
        screen.id = 'securityScreen';
        screen.innerHTML =
            '<div class="security-message">' +
                '<div class="security-title">' +
                    'FIRMWARE NOT SUPPORTED' +
                '</div>' +
                '<div class="security-info">' +
                    'Detected firmware: ' +
                    (
                        firmware !== null
                            ? firmware.toFixed(2)
                            : 'UNKNOWN'
                    ) +
                '</div>' +
                '<div class="security-info">' +
                    'Supported firmware: ' +
                    getSupportedFirmwareText() +
                '</div>' +
                '<div class="security-countdown">' +
                    'Redirecting to firmware selection in ' +
                    '<span id="securityCountdown">3</span>...' +
                '</div>' +
            '</div>';
        document.body.appendChild(screen);
        startCountdown();
    }

    function startCountdown() {
        var countdown = 3;
        var countdownElement =
            document.getElementById('securityCountdown');
        var timer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href =
                    getRootSelector();
                return;
            }
            countdownElement.textContent =
                countdown;
        }, 1000);
    }

    var style = document.createElement('style');
    style.textContent = `
        html.security-error,
        html.security-error body {
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: #050706 !important;
        }
        
        html.security-error body > *:not(#securityScreen) {
            display: none !important;
        }

        #securityScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050706;
            color: #73f5a6;
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            text-align: center;
            z-index: 999999;
        }

        .security-message {
            width: min(90%, 700px);
            padding: 30px;
            border: 1px solid #34443a;
            background: #080c0a;
            box-shadow:
                0 0 30px rgba(115, 245, 166, 0.05);
        }

        .security-title {
            color: #73f5a6;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-bottom: 22px;
        }

        .security-info {
            color: #b4c1b8;
            font-size: 14px;
            line-height: 1.7;
        }

        .security-countdown {
            color: #73f5a6;
            font-size: 15px;
            margin-top: 24px;
            letter-spacing: 0.04em;
        }

        #securityCountdown {
            color: #ffffff;
            font-size: 20px;
        }
    `;

    document.head.appendChild(style);
    var detectedFirmware = getPS4Firmware();

    if (!isPS4()) {
        showUnsupportedDevice();
        return;
    }

    if (!isFirmwareSupported(detectedFirmware)) {
        showUnsupportedFirmware(detectedFirmware);
        return;
    }
})();
</script>
</body>
</html>
