<!doctype html>
<html lang="en" manifest="cache.manifest">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PlayStation 4 Relapse Host</title>
  <link rel="icon" type="image/png" href="/pstation.png">

  <style>
    :root {
      --bg: #050706;
      --panel: #080c0a;
      --raised: #0d1510;
      --line: #34443a;
      --line-bright: #607b68;
      --text: #f1f6f2;
      --muted: #b4c1b8;
      --dim: #86958b;
      --green: #73f5a6;
      --red: #ff9b9b;
      --yellow: #f0d878;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    #cache {
      color: var(--dim);
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      min-height: 24px;
      overflow-wrap: anywhere;
    }

    #cache.cacheok {
      color: var(--green);
    }

    html,
    body {
      min-height: 100%;
    }

    html {
      background: var(--bg);
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(
          rgba(115, 245, 166, 0.03) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(115, 245, 166, 0.03) 1px,
          transparent 1px
        );
      background-size: 32px 32px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      font: 16px/1.5
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex: 1 0 auto;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: 24px 0 20px;
      width: min(100% - 64px, 1120px);
    }

    .header-section,
    .status-container {
      background: rgba(8, 12, 10, 0.92);
      border: 1px solid var(--line);
    }

    .header-section {
      margin-bottom: 12px;
      padding: 20px 28px 22px;
      position: relative;
    }

    .header-section::before {
      color: var(--green);
      content: "●  PS4 / Relapse HOST";
      display: block;
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .header-section::after {
      color: var(--dim);
      content: "SYS / EXECUTION   //   OFFLINE MODE";
      font-size: 12px;
      letter-spacing: 0.08em;
      position: absolute;
      right: 28px;
      top: 21px;
    }

    .main-title {
      color: var(--text);
      font-size: clamp(30px, 5vw, 50px);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 1.05;
    }

    .main-title::before {
      color: var(--green);
      content: "> ";
    }

    .subtitle {
      color: var(--green);
      font-size: 16px;
      margin-top: 12px;
    }

    .version-info {
      color: var(--muted);
      font-size: 14px;
      margin-top: 7px;
    }

    .status-container {
      color: var(--muted);
      padding: 14px 18px;
    }

    .status-label {
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      padding-bottom: 9px;
      text-transform: uppercase;
    }

    #msg,
    #state,
    #out {
      background: var(--panel);
      border: 1px solid var(--line-bright);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 14px;
    }

    #msg {
      min-height: 42px;
    }

    #state,
    #out {
      margin-top: 10px;
      overflow: auto;
      white-space: pre-wrap;
    }

    #state,
    #out {
      display: none;
    }

    body.log #state,
    body.log #out {
      display: block;
    }

    .status-line {
      color: var(--dim);
      font-size: 12px;
      margin-top: 10px;
    }

    .status-line::before {
      color: var(--green);
      content: "[READY] ";
    }

    #spin {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 8px;
      border: 2px solid var(--line-bright);
      border-top-color: var(--green);
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin 0.8s linear infinite;
    }

    body.done #spin {
      display: none;
    }

    body.fail #spin {
      display: none;
    }

    body.fail #msg::after {
      content: "Restart your console";
    }

    body.done .status-line::before {
      color: var(--green);
      content: "[DONE] ";
    }

    body.fail .status-line::before {
      color: var(--red);
      content: "[FAIL] ";
    }

    body.done #msg {
      border-color: var(--green);
      color: var(--green);
    }

    body.fail #msg {
      border-color: var(--red);
      color: var(--red);
    }

    .credits {
      border-top: 1px solid var(--line);
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 13px;
      margin: 0 auto;
      padding: 8px 20px 10px;
      text-align: center;
      width: min(100% - 64px, 1120px);
    }

    .credits a {
      color: var(--text);
    }

    .credits a:hover,
    .credits a:focus {
      color: var(--green);
    }

    .credits-line {
      display: inline;
    }

    .credit-label {
      color: var(--muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .container {
        justify-content: flex-start;
        padding: 24px 0 20px;
        width: min(100% - 32px, 560px);
      }

      .header-section {
        padding: 20px 18px 22px;
      }

      .header-section::after {
        display: none;
      }

      .main-title {
        font-size: clamp(30px, 9vw, 44px);
      }
    }

    @media (max-width: 430px) {
      .main-title {
        font-size: 30px;
      }

      .credits {
        width: min(100% - 32px, 560px);
      }
    }
  </style>
</head>
<body class="">
  <main class="container">
    <section class="header-section">
      <h1 class="main-title">PlayStation 4 Jailbreak</h1>
      <p class="subtitle">PS4 / Relapse HOST</p>
      <p class="version-info">Offline PlayStation 4 Exploit Host</p>
      <p id="cache">Checking offline cache...</p>
    </section>
    <section class="status-container">
      <div class="status-label">Exploit status</div>
      <div id="msg"><span id="spin"></span></div>
      <div id="state"></div>
      <pre id="out"></pre>
      <div class="status-line">Initializing jailbreak...</div>
    </section>
  </main>
  <footer class="credits">
    <div class="credits-line">
      <span class="credit-label">Github Repository -</span>
      <a
        href="https://github.com/itskenethb?tab=repositories"
        class="nodeplay-link"
      >itskenethb</a>
    </div>
  </footer>
  <script type="module">import "./jb.js?v=10";</script>
  <script>
    (function () {var cacheEl = document.getElementById("cache");
        function setCache(text, ok) {
            if (!cacheEl) return;
            cacheEl.textContent = text;
            cacheEl.className = ok ? "cacheok" : "";
        }

        var ac = window.applicationCache;

        if (!ac || !document.documentElement.hasAttribute("manifest")) {
            setCache("application cache unavailable");
        } else if (!navigator.onLine) {
            setCache("offline -- using cached resources", true);
        } else if (ac.status === ac.IDLE) {
            setCache("cached -- offline ready", true);
        } else if (ac.status === ac.UPDATEREADY) {
            try {
                ac.swapCache();
            } catch (e) {}
            setCache("update downloaded -- offline ready", true);
        } else {
            setCache("checking cache...");

            ac.addEventListener("downloading", function () {
                setCache("caching for offline (first run)...");
            }, false);

            ac.addEventListener("progress", function (e) {
                if (e && e.total) {
                    setCache(
                        "caching " +
                        Math.round((e.loaded / e.total) * 100) +
                        "%"
                    );
                }
            }, false);

            ac.addEventListener("cached", function () {
                setCache("cached for offline use disconnect to the internet first and rerun this page", true);
            }, false);

            ac.addEventListener("updateready", function () {
                try {
                    ac.swapCache();
                } catch (e) {}
                setCache("update downloaded -- offline ready", true);
            }, false);

            ac.addEventListener("noupdate", function () {
                setCache("cached -- offline ready", true);
            }, false);

            ac.addEventListener("error", function () {
                setCache("cache unavailable");
            }, false);

            ac.addEventListener("obsolete", function () {
                setCache("cache obsolete");
            }, false);
        }
    })();
    </script>
</body>
</html>
